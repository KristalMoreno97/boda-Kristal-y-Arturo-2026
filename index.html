<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kristal & Arturo · Nuestra boda</title>
<meta name="theme-color" content="#5a3d27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<script src="js/config.js"></script>

<main>
<section class="hero" id="hero">
  <svg class="scene" id="scene" aria-hidden="true"></svg>

  <div class="card" id="card" role="button" tabindex="0" aria-label="Toca para abrir la invitación">
    <div class="inner">
      <div class="nos rv" style="--rd:1.2s">Nos casamos</div>
      <div class="arch">
        <svg class="frame" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1" d="M2 138 L2 50 A48 48 0 0 1 98 50 L98 138"/>
        </svg>
        <div class="photo">
          <div class="ph">Tu foto<br>aquí</div>
          <img id="foto" alt="Los novios" onerror="this.remove()">
        </div>
      </div>
      <div class="names rv" style="--rd:1.9s"><span id="n1"></span> <i>&amp;</i> <span id="n2"></span></div>
      <div class="date rv" style="--rd:2.4s"><span id="dd"></span><b></b><span id="dm"></span><b></b><span id="dy"></span></div>
    </div>

    <div class="door l"><div class="face front"></div><div class="face back"></div></div>
    <div class="door r"><div class="face front"></div><div class="face back"></div></div>

    <svg class="wreath" id="wreath" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div class="seal" id="seal"></div>
  </div>

  <svg class="scene top" id="sceneFront" aria-hidden="true"></svg>
  <div class="hint">Toca para abrir</div>
  <a class="cue" href="#detalles">Más detalles<span>⌄</span></a>
</section>

<section class="details" id="detalles">
  <div class="wrap">
    <div class="section">
      <h2>Nuestra historia continúa</h2>
      <h3>y ahora para siempre.</h3>
      <svg class="orn" viewBox="0 0 120 14" aria-hidden="true"><path d="M0 7H48M72 7H120" stroke="#c2a15a" fill="none"/><circle cx="60" cy="7" r="3.5" fill="#c2a15a"/><circle cx="52" cy="7" r="1.5" fill="#c2a15a"/><circle cx="68" cy="7" r="1.5" fill="#c2a15a"/></svg>
      <p class="msg" id="msg"></p>
    </div>

    <div class="section">
      <h2>Cuenta regresiva</h2>
      <svg class="orn" viewBox="0 0 120 14" aria-hidden="true"><path d="M0 7H48M72 7H120" stroke="#c2a15a" fill="none"/><circle cx="60" cy="7" r="3.5" fill="#c2a15a"/></svg>
      <div class="count" id="count">
        <div><b id="cd">0</b><small>días</small></div>
        <div><b id="ch">0</b><small>horas</small></div>
        <div><b id="cm">0</b><small>min</small></div>
        <div><b id="cs">0</b><small>seg</small></div>
      </div>
    </div>

    <div class="section">
      <h2>Dónde y cuándo</h2>
      <svg class="orn" viewBox="0 0 120 14" aria-hidden="true"><path d="M0 7H48M72 7H120" stroke="#c2a15a" fill="none"/><circle cx="60" cy="7" r="3.5" fill="#c2a15a"/></svg>
      <div class="cards">
        <div class="info">
          <h3>Ceremonia</h3>
          <div class="big" id="cerL"></div>
          <p id="cerH"></p><p id="cerD"></p>
          <a class="btn" id="cerM" target="_blank" rel="noopener">Ver mapa</a>
        </div>
        <div class="info">
          <h3>Recepción</h3>
          <div class="big" id="recL"></div>
          <p id="recH"></p><p id="recD"></p>
          <a class="btn" id="recM" target="_blank" rel="noopener">Ver mapa</a>
        </div>
      </div>
    </div>

    <div class="section" id="tlBox">
      <h2>Nuestro día, contigo.</h2>
      <svg class="orn" viewBox="0 0 120 14" aria-hidden="true"><path d="M0 7H48M72 7H120" stroke="#c2a15a" fill="none"/><circle cx="60" cy="7" r="3.5" fill="#c2a15a"/></svg>
      <div class="tl" id="tl"></div>
    </div>

    <div class="section dresscode">
      <div class="dc-eyebrow">Código de vestimenta</div>
      <div class="dc-title" id="dress"></div>
      <div class="dc-grid">
        <figure class="dc-col" id="colEllos">
          <div class="dc-who">Ellos</div>
          <svg class="dc-fig" viewBox="0 -4 120 178" aria-hidden="true">
            <path class="hg" d="M60 19V12C60 8 65 7 65 3.5A3.3 3.3 0 1 0 58.6 3"/>
            <path class="hg" d="M60 19L16 41c-3 1.8-1.7 4.2 1 4.2h86c2.700 0 4-2.4 1-4.2z"/>
            <path class="st" d="M22 49L33 43 38 66 34 148 17 145 20 90Z"/>
            <path class="st" d="M98 49L87 43 82 66 86 148 103 145 100 90Z"/>
            <path class="st" d="M33 43C43 40 52 42 60 48 68 42 77 40 87 43L86 70 87 148 33 148 34 70Z"/>
            <path d="M51 44H69L60 100Z" fill="#fbf7ec" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>
            <path class="lp" d="M51 44L60 100 45 87 41 62 47 52Z"/>
            <path class="lp" d="M69 44L60 100 75 87 79 62 73 52Z"/>
            <path d="M60 100V148" stroke="rgba(0,0,0,.3)" stroke-width=".8"/>
            <path d="M60 51L49 45.500V56.500ZM60 51L71 45.500V56.500Z" fill="#171b27"/>
            <rect x="57.300" y="48.300" width="5.400" height="5.400" rx="1.400" fill="#232938"/>
            <path d="M69 78L78 75.500 79.500 81 70 81.500Z" fill="#fbf7ec"/>
            <circle cx="60" cy="113" r="1.700" fill="rgba(255,255,255,.4)"/>
            <circle cx="60" cy="127" r="1.700" fill="rgba(255,255,255,.4)"/>
          </svg>
          <figcaption class="dc-cap" id="dressEllos"></figcaption>
        </figure>
        <figure class="dc-col" id="colEllas">
          <div class="dc-who">Ellas</div>
          <svg class="dc-fig" viewBox="0 -4 120 178" aria-hidden="true">
            <defs>
              <linearGradient id="sheen" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".45" stop-color="#fff" stop-opacity=".30"/>
                <stop offset="1" stop-color="#000" stop-opacity=".12"/>
              </linearGradient>
            </defs>
            <path class="hg" d="M60 19V12C60 8 65 7 65 3.5A3.3 3.3 0 1 0 58.6 3"/>
            <path class="hg" d="M60 19L16 41c-3 1.8-1.7 4.2 1 4.2h86c2.700 0 4-2.4 1-4.2z"/>
            <path d="M45 45L51 66M75 45L69 66" stroke="var(--gown)" stroke-width="1.800" stroke-linecap="round" fill="none"/>
            <path class="gw" d="M50 64L60 83 70 64 74 98H46Z"/>
            <path d="M46 98H74V102H46Z" fill="rgba(0,0,0,.22)"/>
            <path class="gw" d="M46 102H74C80 125 98 150 109 171H11C22 150 40 125 46 102Z"/>
            <path d="M46 102H74C80 125 98 150 109 171H11C22 150 40 125 46 102Z" fill="url(#sheen)"/>
            <path class="gl" d="M53 106C49 130 37 152 29 171" stroke="rgba(0,0,0,.14)" stroke-width="1.200"/>
            <path class="gl" d="M60 106C60 130 59 152 57 171" stroke="rgba(255,255,255,.32)" stroke-width="1.200"/>
            <path class="gl" d="M67 106C70 130 76 152 82 171" stroke="rgba(0,0,0,.14)" stroke-width="1.200"/>
            <path class="gl" d="M50 66L60 83 70 66" stroke="rgba(0,0,0,.22)" stroke-width="1"/>
          </svg>
          <figcaption class="dc-cap" id="dressEllas"></figcaption>
        </figure>
      </div>
      <small class="dc-note" id="dressN"></small>
    </div>

    <div class="section" id="giftBox">
      <div class="dc-eyebrow">Regalos</div>
      <div class="dc-title"><span id="giftT1"></span> <em id="giftT2"></em></div>
      <p class="msg" id="giftText"></p>
      <svg class="gift-env" viewBox="0 0 160 112" aria-hidden="true">
        <rect x="10" y="22" width="140" height="82" rx="5" fill="#fbf5e6" stroke="#d6c28f" stroke-width="1.2"/>
        <path d="M10 25L80 72 150 25" fill="none" stroke="#d6c28f" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M11 102L64 58M149 102L96 58" fill="none" stroke="#e3d4aa" stroke-width="1"/>
        <rect x="71" y="22" width="18" height="82" fill="var(--olive)"/>
        <path d="M71 22V104M89 22V104" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
        <path d="M79 68L67 96 76 91 80 100 82 72Z" fill="var(--olive-d)"/>
        <path d="M81 68L93 96 84 91 80 100 78 72Z" fill="var(--olive)" stroke="var(--olive-d)" stroke-width=".6"/>
        <path d="M80 64C62 40 42 56 60 68 69 73 76 68 80 64Z" fill="var(--olive)" stroke="var(--olive-d)" stroke-width=".8"/>
        <path d="M80 64C98 40 118 56 100 68 91 73 84 68 80 64Z" fill="var(--olive)" stroke="var(--olive-d)" stroke-width=".8"/>
        <circle cx="80" cy="65" r="5.200" fill="var(--olive-d)"/>
        <circle cx="80" cy="65" r="1.800" fill="var(--gold-l)"/>
      </svg>
      <button class="btn" id="giftBtn" type="button" aria-expanded="false">Ver datos de la cuenta</button>
      <div class="gift-panel" id="giftPanel" hidden></div>
    </div>

        <div class="section rsvp" id="rsvpSeccion">
      <p class="dc-eyebrow" id="rsvpEyebrow"></p>
      <h2 class="dc-title" id="rsvpTitulo"></h2>
      <p class="msg" id="rsvpTexto"></p>

      <form class="rsvp-card" id="rsvpForm" autocomplete="off">
        <h3 class="rsvp-saludo" id="rsvpSaludo"></h3>

        <label class="rsvp-label" for="rsvpNombre">Tu nombre o el de tu familia</label>
        <input class="rsvp-input" id="rsvpNombre" type="text" placeholder="Nombre y apellido" required>

        <span class="rsvp-label">¿Nos acompañas?</span>
        <div class="rsvp-choice">
          <label>
            <input type="radio" name="asiste" value="si" checked>
            <span>✓<br>Sí, allí estaré</span>
          </label>
          <label>
            <input type="radio" name="asiste" value="no">
            <span>✕<br>No podré ir</span>
          </label>
        </div>

        <div id="rsvpPersonasBox">
          <label class="rsvp-label" for="rsvpPersonas">¿Cuántos serán en total? (contándote a ti)</label>
          <input class="rsvp-input" id="rsvpPersonas" type="number" min="1" max="20" value="1" inputmode="numeric" required>
        </div>

        <label class="rsvp-label" for="rsvpMensaje">Un mensaje para los novios (opcional)</label>
        <textarea class="rsvp-input" id="rsvpMensaje" rows="3" placeholder="Escribe aquí..."></textarea>

        <button class="btn gold big" type="submit">Enviar confirmación</button>
      </form>

      <!-- se deja oculto para que app.js no marque error si busca #rsvp -->
      <a id="rsvp" hidden></a>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="n" id="fn"></div>
  <p id="fd"></p>
</footer>

<audio id="audio" preload="metadata" loop></audio>
<button class="music" id="musicBtn" aria-label="Música">♪</button>

<script src="js/app.js"></script>
</body>
</html>
